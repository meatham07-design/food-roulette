services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: yemek-ruleti-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yemek-ruleti-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yemek-ruleti-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "echo 'Waiting for database...' && sleep 15 && npx prisma db push --accept-data-loss && npx prisma generate && npm run dev"
    networks:
      - yemek-ruleti-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  yemek-ruleti-network:
    driver: bridge
